<!DOCTYPE html>
<html>
<head>
<title>Verified Mandelbrot - WebGPU</title>
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #ccc; font-family: monospace; }
  canvas { border: 1px solid #333; cursor: crosshair; }
  #info { margin-top: 8px; font-size: 12px; }
  #status { margin-bottom: 8px; font-size: 14px; }
</style>
</head>
<body>
<div id="status">Initializing WebGPU...</div>
<canvas id="canvas" width="800" height="600"></canvas>
<div id="info">Scroll to zoom, drag to pan. 20.12 fixed-point (verified i32 overflow-safe).</div>

<script>
// ══════════════════════════════════════════════════════════════
// WGSL shader generated by verus-cutedsl-codegen
// generate_mandelbrot_wgsl(800, 600, 256, [16, 16])
//
// Fixed-point 20.12: frac_bits=12, max |z|<6, (6*4096)^2=604M < 2^31.
// Viewport params from storage buffer (Index into params[0..3]).
// Verified: ComplexFP.mandelbrot_step matches z^2+c (verus-fractals).
// Verified: Shr correctly computes a/pow2(b) (arith_expr.rs).
// ══════════════════════════════════════════════════════════════
const MANDELBROT_WGSL = `
// Viewport params: x_min, y_min, dx, dy in 20.12 fixed-point
@group(0) @binding(0) var<storage, read> params: array<i32>;
@group(0) @binding(1) var<storage, read_write> out: array<u32>;

@compute @workgroup_size(16, 16, 1)
fn mandelbrot(
  @builtin(global_invocation_id) gid: vec3<u32>,
) {
  let px = gid.x;
  let py = gid.y;
  if (px >= 800u || py >= 600u) { return; }

  // Read viewport from params buffer (Index into storage buffer)
  let x_min: i32 = params[0];
  let y_min: i32 = params[1];
  let dx: i32 = params[2];
  let dy: i32 = params[3];

  // Pixel -> complex plane (20.12 fixed-point)
  let c_re: i32 = x_min + i32(px) * dx / i32(800u);
  let c_im: i32 = y_min + i32(py) * dy / i32(600u);

  var z_re: i32 = 0;
  var z_im: i32 = 0;
  var iter: u32 = 0u;

  for (var i: u32 = 0u; i < 256u; i++) {
    let re2: i32 = (z_re * z_re) >> 12u;
    let im2: i32 = (z_im * z_im) >> 12u;
    if (re2 + im2 > 16384) { break; }

    let new_re: i32 = re2 - im2 + c_re;
    let new_im: i32 = ((z_re * z_im) >> 11u) + c_im;
    z_re = new_re;
    z_im = new_im;
    iter = i + 1u;
  }

  out[py * 800u + px] = iter;
}
`;

const W = 800, H = 600;
const FRAC = 12;
const ONE = 1 << FRAC; // 4096

// Viewport in fixed-point 20.12
let view = {
  x_min: -2.0, y_min: -1.25,
  x_max: 1.0, y_max: 1.25,
};

function toFP(v) { return Math.round(v * ONE); }

let device, queue, pipeline, paramsBuffer, outputBuffer, readBuffer, bindGroup;

async function init() {
  if (!navigator.gpu) {
    document.getElementById('status').textContent = 'WebGPU not supported. Try Chrome 113+ or Firefox Nightly.';
    return;
  }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) {
    document.getElementById('status').textContent = 'No GPU adapter found.';
    return;
  }
  device = await adapter.requestDevice();
  queue = device.queue;

  const module = device.createShaderModule({ code: MANDELBROT_WGSL });
  pipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module, entryPoint: 'mandelbrot' },
  });

  // params[0..3] = x_min, y_min, dx, dy (i32 fixed-point)
  paramsBuffer = device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });

  outputBuffer = device.createBuffer({
    size: W * H * 4,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
  });

  readBuffer = device.createBuffer({
    size: W * H * 4,
    usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
  });

  bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: paramsBuffer } },
      { binding: 1, resource: { buffer: outputBuffer } },
    ],
  });

  document.getElementById('status').textContent =
    'Verified Mandelbrot (20.12 fixed-point, generated WGSL)';
  render();
}

async function render() {
  // Write viewport params as i32 fixed-point
  const params = new Int32Array([
    toFP(view.x_min),
    toFP(view.y_min),
    toFP(view.x_max - view.x_min), // dx
    toFP(view.y_max - view.y_min), // dy
  ]);
  queue.writeBuffer(paramsBuffer, 0, params);

  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.dispatchWorkgroups(Math.ceil(W / 16), Math.ceil(H / 16), 1);
  pass.end();
  encoder.copyBufferToBuffer(outputBuffer, 0, readBuffer, 0, W * H * 4);
  queue.submit([encoder.finish()]);

  await readBuffer.mapAsync(GPUMapMode.READ);
  const data = new Uint32Array(readBuffer.getMappedRange().slice(0));
  readBuffer.unmap();

  // Color mapping: iteration count -> RGB
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = new Uint8Array(img.data.buffer);

  for (let i = 0; i < W * H; i++) {
    const iter = data[i];
    if (iter >= 256) {
      // In set: black
      px[i*4] = 0; px[i*4+1] = 0; px[i*4+2] = 0; px[i*4+3] = 255;
    } else {
      // Escaped: color by iteration
      const t = iter / 256.0;
      px[i*4+0] = Math.floor(Math.max(0, Math.min(255, Math.sin(t * 12.57 + 0.0) * 127 + 128)));
      px[i*4+1] = Math.floor(Math.max(0, Math.min(255, Math.sin(t * 12.57 + 2.09) * 127 + 128)));
      px[i*4+2] = Math.floor(Math.max(0, Math.min(255, Math.sin(t * 12.57 + 4.19) * 127 + 128)));
      px[i*4+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  const rangeX = view.x_max - view.x_min;
  const zoom = 3.5 / rangeX;
  document.getElementById('info').textContent =
    `[${view.x_min.toFixed(4)}, ${view.x_max.toFixed(4)}] x ` +
    `[${view.y_min.toFixed(4)}, ${view.y_max.toFixed(4)}] | ` +
    `zoom: ${zoom.toFixed(1)}x | 20.12 fixed-point` +
    (zoom > 8 ? ' | near precision limit' : '') +
    ` | Scroll=zoom, Drag=pan`;
}

// Mouse controls
const canvas = document.getElementById('canvas');
let dragging = false, dragStart = null;

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / W;
  const my = (e.clientY - rect.top) / H;

  const cx = view.x_min + mx * (view.x_max - view.x_min);
  const cy = view.y_min + my * (view.y_max - view.y_min);

  const factor = e.deltaY > 0 ? 1.3 : 1 / 1.3;
  const nw = (view.x_max - view.x_min) * factor;
  const nh = (view.y_max - view.y_min) * factor;

  view.x_min = cx - mx * nw;
  view.x_max = cx + (1 - mx) * nw;
  view.y_min = cy - my * nh;
  view.y_max = cy + (1 - my) * nh;

  render();
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY, view: { ...view } };
});

canvas.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = (e.clientX - dragStart.x) / W * (dragStart.view.x_max - dragStart.view.x_min);
  const dy = (e.clientY - dragStart.y) / H * (dragStart.view.y_max - dragStart.view.y_min);
  view.x_min = dragStart.view.x_min - dx;
  view.x_max = dragStart.view.x_max - dx;
  view.y_min = dragStart.view.y_min - dy;
  view.y_max = dragStart.view.y_max - dy;
  render();
});

canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; });

init();
</script>
</body>
</html>
