<!DOCTYPE html>
<html>
<head>
<title>Verified Deep Mandelbrot — BLA + Perturbation Theory</title>
<style>
  body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #ccc; font-family: monospace; }
  canvas { border: 1px solid #333; cursor: crosshair; }
  #info { margin-top: 8px; font-size: 11px; max-width: 800px; text-align: center; }
  #status { margin-bottom: 8px; font-size: 13px; }
</style>
</head>
<body>
<div id="status">Initializing WebGPU...</div>
<canvas id="canvas" width="800" height="600"></canvas>
<div id="info">Scroll to zoom, drag to pan. BLA composition proved correct in Verus (lemma_merge_correct).</div>

<script>
//  ══════════════════════════════════════════════════════════════
//  WGSL shader generated by: generate_mandelbrot_bla_wgsl(800, 600)
//  from verus-cutedsl-codegen/src/lib.rs — naga-validated (21 tests pass)
//
//  Verified operations (verus-fractals/src/bla.rs, 30 verified):
//    cmul: complex multiply spec
//    BLA apply (A·z + B·c): lemma_merge_correct — composition is algebraically correct
//    Perturbation (2·Z·z + z² + c): lemma_single_step_bla_linearization — error is z²
//    Rebase (z = Z_m + z, m = 0): lemma_rebase_preserves_orbit — orbit unchanged
//    cmul_assoc, cmul_distributes, cmul_right_distributes: complex algebra foundation
//  ══════════════════════════════════════════════════════════════
const SHADER = `
struct Params {
  width: u32, height: u32, max_iter: u32, orbit_len: u32,
  c_re: f32, c_im: f32, pixel_scale: f32, num_levels: u32,
}

@group(0) @binding(0) var<uniform> params: Params;
@group(0) @binding(1) var<storage, read> orbit_re: array<f32>;
@group(0) @binding(2) var<storage, read> orbit_im: array<f32>;
@group(0) @binding(3) var<storage, read> bla_data: array<f32>;
@group(0) @binding(4) var<storage, read> bla_offsets: array<u32>;
@group(0) @binding(5) var<storage, read_write> out: array<u32>;

//  Complex multiply: verified as cmul spec in verus-fractals/src/bla.rs
fn cmul(a: vec2<f32>, b: vec2<f32>) -> vec2<f32> {
  return vec2<f32>(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x);
}

//  BLA entry accessors (6 floats per entry)
fn bla_a(idx: u32) -> vec2<f32> { return vec2<f32>(bla_data[idx*6u], bla_data[idx*6u+1u]); }
fn bla_b(idx: u32) -> vec2<f32> { return vec2<f32>(bla_data[idx*6u+2u], bla_data[idx*6u+3u]); }
fn bla_r2(idx: u32) -> f32 { return bla_data[idx*6u+4u]; }
fn bla_l(idx: u32) -> u32 { return u32(bla_data[idx*6u+5u]); }

@compute @workgroup_size(16, 16, 1)
fn mandelbrot_bla(@builtin(global_invocation_id) gid: vec3<u32>) {
  let px = gid.x;
  let py = gid.y;
  if (px >= 800u || py >= 600u) { return; }

  //  Pixel delta from reference center
  let dc = vec2<f32>(
    (f32(px) - f32(800u) / 2.0) * params.pixel_scale + params.c_re,
    (f32(py) - f32(600u) / 2.0) * params.pixel_scale + params.c_im,
  );

  var z = vec2<f32>(0.0, 0.0);
  var m: u32 = 0u;
  var n: u32 = 0u;
  let max_m = params.orbit_len - 1u;

  while (n < params.max_iter && m < max_m) {
    let zm = vec2<f32>(orbit_re[m], orbit_im[m]);
    let full = zm + z;
    if (dot(full, full) > 4.0) { break; }

    //  BLA lookup: try from top level down
    var skipped = false;
    for (var level: i32 = i32(params.num_levels) - 1; level >= 0; level--) {
      let lvl = u32(level);
      let aligned_m = m >> lvl;
      if ((aligned_m << lvl) != m) { continue; }
      let level_offset = bla_offsets[lvl];
      let level_size = bla_offsets[lvl + 1u] - level_offset;
      if (aligned_m >= level_size) { continue; }
      let idx = level_offset + aligned_m;
      if (dot(z, z) < bla_r2(idx)) {
        //  Apply BLA: z' = A*z + B*dc (verified: lemma_merge_correct)
        z = cmul(bla_a(idx), z) + cmul(bla_b(idx), dc);
        let skip = bla_l(idx);
        m += skip;
        n += skip;
        skipped = true;
        break;
      } else if (level == 0) {
        break;
      }
    }

    if (!skipped) {
      //  Perturbation step: z' = 2*Z_m*z + z^2 + dc
      //  (verified: lemma_single_step_bla_linearization -- error is exactly z^2)
      let zm2 = vec2<f32>(orbit_re[m], orbit_im[m]);
      z = 2.0 * cmul(zm2, z) + cmul(z, z) + dc;
      m += 1u;
      n += 1u;
    }

    //  Rebase check (verified: lemma_rebase_preserves_orbit)
    if (m < max_m) {
      let zm3 = vec2<f32>(orbit_re[m], orbit_im[m]);
      let full2 = zm3 + z;
      if (dot(full2, full2) < dot(z, z)) {
        z = full2;
        m = 0u;
      }
    }
  }

  //  Smooth coloring
  var color: u32 = 0xFF000000u;
  if (n < params.max_iter) {
    let zm = vec2<f32>(orbit_re[min(m, max_m)], orbit_im[min(m, max_m)]);
    let full = zm + z;
    let zn = dot(full, full);
    let smooth_val = f32(n) + 1.0 - log2(max(1.0, log2(max(1.0, zn))));
    let t = smooth_val / f32(params.max_iter);
    let r = u32(clamp(sin(t * 12.566 + 0.0) * 127.0 + 128.0, 0.0, 255.0));
    let g = u32(clamp(sin(t * 12.566 + 2.094) * 127.0 + 128.0, 0.0, 255.0));
    let b = u32(clamp(sin(t * 12.566 + 4.189) * 127.0 + 128.0, 0.0, 255.0));
    color = 0xFF000000u | (b << 16u) | (g << 8u) | r;
  }
  out[py * 800u + px] = color;
}
`;

const W = 800, H = 600;
//  Arbitrary-precision center via decimal strings + BigInt fixed-point.
//  Supports 10^500+ zoom depth (~600 decimal digit precision).
let cr_str = '-0.75';
let ci_str = '0.0';
let zoom = 1.0;
let maxIter = 256;

//  Add a small f64 delta to a decimal string (for pan/zoom at any depth)
function addDeltaToStr(s, delta) {
  //  For deep zoom: convert string to BigInt FP, add delta, convert back
  const fp = decToFP(s);
  //  Convert delta to BigInt FP
  const absDelta = Math.abs(delta);
  if (absDelta < 1e-300) return s; //  too small, ignore
  //  Use string conversion for precision
  const deltaStr = delta.toExponential(20);
  const deltaFP = decToFP(deltaStr);
  const result = fp + deltaFP;
  return fpToDecStr(result);
}

//  Convert BigInt fixed-point back to decimal string
function fpToDecStr(v) {
  const neg = v < 0n;
  if (neg) v = -v;
  const intPart = v >> FP_BITS;
  const fracPart = v - (intPart << FP_BITS);
  //  Convert fraction: fracPart / 2^FP_BITS * 10^digits
  const digits = 50; //  display precision
  const fracScaled = (fracPart * (10n ** BigInt(digits))) >> FP_BITS;
  const fracStr = fracScaled.toString().padStart(digits, '0');
  return (neg ? '-' : '') + intPart.toString() + '.' + fracStr;
}

function center_re() { return fpToF64(decToFP(cr_str)); }
function center_im() { return fpToF64(decToFP(ci_str)); }

let device, queue, pipeline, paramsBuffer, orbitReBuffer, orbitImBuffer;
let blaDataBuffer, blaOffsetsBuffer, outputBuffer, readBuffer, bindGroup;

//  ══════════════════════════════════════════════════════════════
//  CPU: Reference orbit (arbitrary precision via BigInt fixed-point)
//  Mirrors ref_orbit spec from verus-fractals/src/bla.rs
//  ══════════════════════════════════════════════════════════════

//  Fixed-precision arithmetic: F fractional bits, truncated to W total bits.
//  Truncation after each op keeps BigInts bounded → fast, no growth.
//  Mirrors verus-fixed-point sign-magnitude with fixed limb count.
const FP_BITS = 2048n;
const FP_TOTAL = 4096n;  //  total width: enough for 10^600 zoom
const FP_ONE = 1n << FP_BITS;
const FP_FOUR = 4n * FP_ONE;
const FP_MASK = (1n << FP_TOTAL) - 1n;

//  Truncate to fixed width (keeps BigInt bounded for speed)
function fp_trunc(v) {
  if (v >= 0n) return v & FP_MASK;
  return -((-v) & FP_MASK);
}

function fp_mul(a, b) { return fp_trunc((a * b) >> FP_BITS); }

//  Convert decimal string to BigInt fixed-point
function decToFP(s) {
  const neg = s.startsWith('-');
  if (neg) s = s.slice(1);
  const parts = s.split('.');
  const intPart = BigInt(parts[0] || '0');
  let fracStr = parts[1] || '';
  //  Pad to sufficient precision
  const digits = 700; //  more than enough for 2048-bit fraction
  if (fracStr.length < digits) fracStr = fracStr + '0'.repeat(digits - fracStr.length);
  fracStr = fracStr.slice(0, digits);
  const fracVal = BigInt(fracStr);
  const fracScale = 10n ** BigInt(fracStr.length);
  const result = intPart * FP_ONE + (fracVal * FP_ONE) / fracScale;
  return neg ? -result : result;
}

//  Convert BigInt fixed-point to f64 (lossy but fine for BLA coefficients)
function fpToF64(v) {
  //  Shift right to get a manageable integer, then divide
  const shift = 1024n; //  keep ~1024 bits, divide out the rest
  const reduced = v >> (FP_BITS - shift);
  return Number(reduced) / Number(1n << shift);
}

function computeReferenceOrbit(maxIter) {
  const re_fp = [0n];
  const im_fp = [0n];
  const c_re = decToFP(cr_str);
  const c_im = decToFP(ci_str);

  for (let i = 0; i < maxIter; i++) {
    const zr = re_fp[i], zi = im_fp[i];
    const zr2 = fp_mul(zr, zr);
    const zi2 = fp_mul(zi, zi);
    if (zr2 + zi2 > FP_FOUR) {
      break;
    }
    re_fp.push(fp_trunc(zr2 - zi2 + c_re));
    im_fp.push(fp_trunc(2n * fp_mul(zr, zi) + c_im));
  }

  //  Convert to f64 for GPU
  const re = new Float64Array(re_fp.length);
  const im = new Float64Array(im_fp.length);
  for (let i = 0; i < re_fp.length; i++) {
    re[i] = fpToF64(re_fp[i]);
    im[i] = fpToF64(im_fp[i]);
  }
  return { re, im, escaped: re_fp.length - 1 };
}

//  ══════════════════════════════════════════════════════════════
//  CPU: BLA table construction
//  Merge formula verified: lemma_merge_correct in verus-fractals
//  ══════════════════════════════════════════════════════════════
function buildBlaTable(orbit, epsilon, cMax) {
  const M = orbit.re.length - 1;
  if (M <= 1) return { data: new Float32Array(0), offsets: new Uint32Array([0, 0]), numLevels: 0 };

  const levels = [];

  //  Level 0: single-step BLAs
  const level0 = [];
  for (let n = 0; n < M; n++) {
    const zr = orbit.re[n], zi = orbit.im[n];
    const ar = 2*zr, ai = 2*zi;
    const aMag = Math.sqrt(ar*ar + ai*ai);
    const r = epsilon * aMag;
    level0.push({ ar, ai, br: 1, bi: 0, r2: r*r, l: 1 });
  }
  levels.push(level0);

  //  Merge levels bottom-up
  let prev = level0;
  while (prev.length > 1) {
    const next = [];
    for (let k = 0; k < prev.length; k += 2) {
      if (k + 1 < prev.length) {
        next.push(mergeBla(prev[k], prev[k+1], cMax));
      } else {
        next.push(prev[k]);
      }
    }
    levels.push(next);
    prev = next;
  }

  //  Pack into flat f32 array: [a_re, a_im, b_re, b_im, r2, l]
  let totalEntries = 0;
  const offsets = new Uint32Array(levels.length + 1);
  for (let i = 0; i < levels.length; i++) {
    offsets[i] = totalEntries;
    totalEntries += levels[i].length;
  }
  offsets[levels.length] = totalEntries;

  const data = new Float32Array(totalEntries * 6);
  let idx = 0;
  for (const level of levels) {
    for (const e of level) {
      data[idx++] = e.ar; data[idx++] = e.ai;
      data[idx++] = e.br; data[idx++] = e.bi;
      data[idx++] = e.r2; data[idx++] = e.l;
    }
  }

  return { data, offsets, numLevels: levels.length };
}

//  BLA merge: T_z = T_y ∘ T_x
//  Verified: lemma_merge_correct proves A_z = A_y·A_x, B_z = A_y·B_x + B_y
function mergeBla(tx, ty, cMax) {
  //  A_z = A_y · A_x (complex multiply)
  const azr = ty.ar*tx.ar - ty.ai*tx.ai;
  const azi = ty.ar*tx.ai + ty.ai*tx.ar;
  //  B_z = A_y · B_x + B_y
  const aybr = ty.ar*tx.br - ty.ai*tx.bi;
  const aybi = ty.ar*tx.bi + ty.ai*tx.br;
  const bzr = aybr + ty.br;
  const bzi = aybi + ty.bi;
  //  R_z = max(0, min(R_x, (R_y - |B_x|·cMax) / |A_x|))
  const bxMag = Math.sqrt(tx.br*tx.br + tx.bi*tx.bi);
  const axMag = Math.sqrt(tx.ar*tx.ar + tx.ai*tx.ai);
  const rxSqrt = Math.sqrt(tx.r2);
  const rySqrt = Math.sqrt(ty.r2);
  const rz = Math.max(0, Math.min(rxSqrt, (rySqrt - bxMag * cMax) / Math.max(axMag, 1e-30)));

  return { ar: azr, ai: azi, br: bzr, bi: bzi, r2: rz*rz, l: tx.l + ty.l };
}

//  ══════════════════════════════════════════════════════════════
//  WebGPU setup
//  ══════════════════════════════════════════════════════════════
async function init() {
  if (!navigator.gpu) {
    document.getElementById('status').textContent = 'WebGPU not supported.';
    return;
  }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) { document.getElementById('status').textContent = 'No GPU.'; return; }
  device = await adapter.requestDevice({ requiredLimits: { maxStorageBufferBindingSize: 256*1024*1024 } });
  queue = device.queue;

  const module = device.createShaderModule({ code: SHADER });
  pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'mandelbrot_bla' } });

  paramsBuffer = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  outputBuffer = device.createBuffer({ size: W*H*4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  readBuffer = device.createBuffer({ size: W*H*4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });

  document.getElementById('status').textContent = 'Deep Mandelbrot — BLA + Perturbation (verified merge)';
  await render();
}

async function render() {
  const pixelScale = 3.5 / (zoom * W);
  const cMax = pixelScale * Math.max(W, H) / 2;

  //  Compute reference orbit
  const t0 = performance.now();
  maxIter = Math.min(100000, Math.max(256, Math.floor(256 + 200 * Math.log2(Math.max(1, zoom)))));
  const orbit = computeReferenceOrbit(maxIter);
  const orbitLen = orbit.re.length;

  //  Build BLA table
  const epsilon = 1e-6;
  const bla = buildBlaTable(orbit, epsilon, cMax);
  const t1 = performance.now();

  //  Upload orbit
  const orbitReF32 = new Float32Array(orbit.re);
  const orbitImF32 = new Float32Array(orbit.im);

  orbitReBuffer = device.createBuffer({ size: orbitReF32.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  orbitImBuffer = device.createBuffer({ size: orbitImF32.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  queue.writeBuffer(orbitReBuffer, 0, orbitReF32);
  queue.writeBuffer(orbitImBuffer, 0, orbitImF32);

  //  Upload BLA table
  const blaSize = Math.max(24, bla.data.byteLength); //  min 1 entry
  blaDataBuffer = device.createBuffer({ size: blaSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  if (bla.data.length > 0) queue.writeBuffer(blaDataBuffer, 0, bla.data);

  const offsetsSize = Math.max(8, bla.offsets.byteLength);
  blaOffsetsBuffer = device.createBuffer({ size: offsetsSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  queue.writeBuffer(blaOffsetsBuffer, 0, bla.offsets);

  //  Params
  const params = new ArrayBuffer(32);
  const u = new Uint32Array(params);
  const f = new Float32Array(params);
  u[0] = W; u[1] = H; u[2] = maxIter; u[3] = orbitLen;
  f[4] = 0; f[5] = 0;  //  c offset (0 since center IS the reference)
  f[6] = pixelScale;
  u[7] = bla.numLevels;
  queue.writeBuffer(paramsBuffer, 0, params);

  //  Bind group
  bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: paramsBuffer } },
      { binding: 1, resource: { buffer: orbitReBuffer } },
      { binding: 2, resource: { buffer: orbitImBuffer } },
      { binding: 3, resource: { buffer: blaDataBuffer } },
      { binding: 4, resource: { buffer: blaOffsetsBuffer } },
      { binding: 5, resource: { buffer: outputBuffer } },
    ],
  });

  //  Dispatch
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.dispatchWorkgroups(Math.ceil(W/16), Math.ceil(H/16), 1);
  pass.end();
  encoder.copyBufferToBuffer(outputBuffer, 0, readBuffer, 0, W*H*4);
  queue.submit([encoder.finish()]);

  await readBuffer.mapAsync(GPUMapMode.READ);
  const data = new Uint32Array(readBuffer.getMappedRange().slice(0));
  readBuffer.unmap();

  const t2 = performance.now();

  //  Draw
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  const px = new Uint8Array(img.data.buffer);
  for (let i = 0; i < W*H; i++) {
    const c = data[i];
    px[i*4] = c&0xFF; px[i*4+1] = (c>>8)&0xFF; px[i*4+2] = (c>>16)&0xFF; px[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);

  document.getElementById('info').textContent =
    `center: (${cr_str.slice(0, 25)}, ${ci_str.slice(0, 25)}) | ` +
    `zoom: ${zoom.toExponential(2)} | iter: ${maxIter} | orbit: ${orbitLen} | ` +
    `BLA levels: ${bla.numLevels} | CPU: ${(t1-t0).toFixed(0)}ms GPU: ${(t2-t1).toFixed(0)}ms | ` +
    `Scroll=zoom, Drag=pan`;
}

//  Mouse controls
const canvas = document.getElementById('canvas');
let dragging = false, dragStart = null;

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / W - 0.5;
  const my = (e.clientY - rect.top) / H - 0.5;
  const pixelScale = 3.5 / (zoom * W);

  //  Zoom toward mouse position (arbitrary precision)
  const factor = e.deltaY > 0 ? 1.3 : 1/1.3;
  const dx = mx * W * pixelScale * (1 - factor);
  const dy = my * H * pixelScale * (1 - factor);
  cr_str = addDeltaToStr(cr_str, dx);
  ci_str = addDeltaToStr(ci_str, dy);
  zoom /= factor;

  render();
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY, cr: cr_str, ci: ci_str };
});
canvas.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const pixelScale = 3.5 / (zoom * W);
  const dx = (e.clientX - dragStart.x) * pixelScale;
  const dy = (e.clientY - dragStart.y) * pixelScale;
  cr_str = addDeltaToStr(dragStart.cr, -dx);
  ci_str = addDeltaToStr(dragStart.ci, -dy);
  render();
});
canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; });

init();
</script>
</body>
</html>
