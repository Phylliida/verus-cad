[package]
name = "verus-cutedsl-codegen"
version = "0.1.0"
edition = "2021"

[dependencies]
# proc-macro deps kept for potential future #[kernel] macro
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
naga = { version = "29.0.0", features = ["wgsl-in"] }
